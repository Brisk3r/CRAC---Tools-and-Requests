                                            <label className="block text-xs font-extrabold text-slate-700 uppercase mb-1">Target Pool</label>
                                            <select
                                                value={formPoolId}
                                                onChange={e => {
                                                    setFormPoolId(e.target.value);
                                                    setFormSelectedZones([]);
                                                }}
                                                className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-bold bg-white outline-none">
                                                {CRAC_POOLS.map(p => (
                                                    <option key={p.id} value={p.id}>{p.name}</option>
                                                ))}
                                            </select>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-extrabold text-slate-700 uppercase mb-1">Priority / Type</label>
                                            <select
                                                value={formPriority}
                                                onChange={e => setFormPriority(e.target.value)}
                                                className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-bold bg-white outline-none">
                                                <option value="Critical Closure">Critical Closure</option>
                                                <option value="Operational Notice">Operational Notice</option>
                                                <option value="Maintenance">Maintenance</option>
                                                <option value="School Carnival">School Carnival</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <div className="flex items-center justify-between mb-1">
                                            <label className="text-xs font-extrabold text-slate-700 uppercase">Target Zones / Lanes</label>
                                            <div className="flex items-center gap-2">
                                                <button type="button" onClick={selectAllLanes} className="text-[11px] font-bold text-blue-600 hover:underline">Select All</button>
                                                <span className="text-slate-300">•</span>
                                                <button type="button" onClick={clearAllLanes} className="text-[11px] font-bold text-slate-500 hover:underline">Clear</button>
                                            </div>
                                        </div>
                                        <div className="flex flex-wrap gap-1.5 p-2 bg-slate-50 border border-slate-200 rounded-xl">
                                            {activeFormPool.lanes.map(lane => (
                                                <button
                                                    key={lane}
                                                    type="button"
                                                    onClick={() => toggleZone(lane)}
                                                    className={`px-2.5 py-1 rounded-lg text-xs font-extrabold transition ${
                                                        formSelectedZones.includes(lane) || formIsEntirePool
                                                            ? 'bg-rose-600 text-white shadow-xs'
                                                            : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-100'
                                                    }`}>
                                                    {lane}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-3 gap-2">
                                        <div>
                                            <label className="block text-xs font-extrabold text-slate-700 uppercase mb-1">Date</label>
                                            <input
                                                type="date"
                                                value={formStartDate}
                                                onChange={e => setFormStartDate(e.target.value)}
                                                className="w-full px-2.5 py-2 border border-slate-300 rounded-xl text-xs font-bold outline-none"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-extrabold text-slate-700 uppercase mb-1">Start Time</label>
                                            <input
                                                type="time"
                                                value={formStartTime}
                                                onChange={e => setFormStartTime(e.target.value)}
                                                className="w-full px-2.5 py-2 border border-slate-300 rounded-xl text-xs font-bold outline-none"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-extrabold text-slate-700 uppercase mb-1">End Time</label>
                                            <input
                                                type="time"
                                                value={formEndTime}
                                                onChange={e => setFormEndTime(e.target.value)}
                                                className="w-full px-2.5 py-2 border border-slate-300 rounded-xl text-xs font-bold outline-none"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-extrabold text-slate-700 uppercase mb-1">Public Reason / Notice</label>
                                        <textarea
                                            value={formReason}
                                            onChange={e => setFormReason(e.target.value)}
                                            rows="2"
                                            placeholder="Reason displayed on public availability displays..."
                                            className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-medium focus:ring-2 focus:ring-blue-500 outline-none"
                                        />
                                    </div>

                                    <div className="pt-2 flex justify-end gap-2">
                                        <button
                                            type="button"
                                            onClick={() => setIsModalOpen(false)}
                                            className="px-4 py-2 border border-slate-200 text-slate-600 rounded-xl text-xs font-extrabold hover:bg-slate-50 transition">
                                            Cancel
                                        </button>
                                        <button
                                            type="submit"
                                            className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-extrabold transition shadow-md shadow-blue-500/20">
                                            Publish Directive
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- ROOT APP ---
        const App = () => {
            const [isAuthenticated, setIsAuthenticated] = useState(false);

            const handleAuthSuccess = () => {
                setIsAuthenticated(true);
            };

            const handleLogout = async () => {
                try {
                    if (prodAuth && prodAuth.currentUser) await prodAuth.signOut();
                } catch (e) {}
                setIsAuthenticated(false);
            };

            if (!isAuthenticated) {
                return <CRACLoginScreen onAuthSuccess={handleAuthSuccess} />;
            }

            return <CRACDutyManagerPortal onLogout={handleLogout} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
