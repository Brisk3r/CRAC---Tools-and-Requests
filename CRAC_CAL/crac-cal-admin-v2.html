        // Initialise isolated CRAC sync engine

        const CRAC_FACILITY = ZoneSyncAPI.FACILITY_SPECIFICATIONS.CRAC;
        const CRAC_POOLS = CRAC_FACILITY.pools; // 50m Pool (8), 25m Pool (8), Program Pool (3)

        const CATEGORY_STYLES = {
            'Learn to Swim': { bg: 'bg-blue-50', text: 'text-blue-900', border: 'border-blue-200', dot: 'bg-blue-600' },
            'Squads': { bg: 'bg-indigo-50', text: 'text-indigo-900', border: 'border-indigo-200', dot: 'bg-indigo-600' },
            'Aqua Fitness': { bg: 'bg-teal-50', text: 'text-teal-900', border: 'border-teal-200', dot: 'bg-teal-600' },
            'Bookings': { bg: 'bg-purple-50', text: 'text-purple-900', border: 'border-purple-200', dot: 'bg-purple-600' },
            'School Carnival': { bg: 'bg-amber-50', text: 'text-amber-900', border: 'border-amber-200', dot: 'bg-amber-600' },
            'Maintenance Closure': { bg: 'bg-rose-50', text: 'text-rose-900', border: 'border-rose-300', dot: 'bg-rose-600' },
            'Default': { bg: 'bg-slate-50', text: 'text-slate-800', border: 'border-slate-200', dot: 'bg-slate-500' }
        };

        const localDateKey = (value) => {
            const d = new Date(value);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        const formatOperatingTime = (decimalHour) => {
            if (typeof decimalHour !== 'number' || isNaN(decimalHour)) return '';
            const h = Math.floor(decimalHour);
            const m = Math.round((decimalHour - h) * 60);
            const period = h >= 12 ? 'pm' : 'am';
            const displayH = h > 12 ? h - 12 : (h === 0 ? 12 : h);
            const displayM = m > 0 ? `:${m.toString().padStart(2, '0')}` : ':00';
            return `${displayH}${displayM} ${period}`;
        };

        const parseTimeToDecimal = (timeStr, fallbackDate) => {
            if (typeof timeStr === 'string' && timeStr.includes(':')) {
                const parts = timeStr.trim().split(':');
                const h = parseInt(parts[0], 10);
                const m = parseInt(parts[1], 10);
                if (!isNaN(h) && !isNaN(m)) return h + m / 60;
            }
            if (fallbackDate) {
                const d = new Date(fallbackDate);
                return d.getHours() + d.getMinutes() / 60;
            }
            return 0;
        };

        const normaliseCracPoolId = (rawPool, rawZone) => {
            const p = String(rawPool || rawZone || '');
            if (/all\s*pools/i.test(p)) return 'All Pools';
            if (/program|warm|hydro|therapy|zone/i.test(p)) return 'Program Pool';
            if (/25m|indoor/i.test(p)) return '25m Pool';
            if (/50m|olympic/i.test(p)) return '50m Pool';
            return '50m Pool';
        };

        const normaliseShortZone = (z) => {
            const str = String(z || '').trim();
            if (!str) return 'All Lanes';
            const stripped = str.replace(/^(50m\s*Pool|25m\s*Pool|Program\s*Pool)\s*-\s*/i, '').trim();
            if (/entire|all\s*lanes|all\s*zones|whole/i.test(stripped)) return 'All Lanes';
            return stripped;
        };

        const normaliseFirestoreDoc = (doc) => {
            const d = doc.data();
            let sDate = d.startDateTime;
            if (sDate && sDate.toDate) sDate = sDate.toDate();
            else if (sDate) sDate = new Date(sDate);
            else if (d.date && d.startTime) sDate = new Date(`${d.date}T${d.startTime}:00`);
            else sDate = new Date();

            let eDate = d.endDateTime;
            if (eDate && eDate.toDate) eDate = eDate.toDate();
            else if (eDate) eDate = new Date(eDate);
            else if (d.date && d.endTime) eDate = new Date(`${d.date}T${d.endTime}:00`);
            else eDate = new Date(sDate.getTime() + 60 * 60 * 1000);

            const poolId = normaliseCracPoolId(d.pool, d.zone || d.lane);
            const rawZones = Array.isArray(d.zones) && d.zones.length > 0
                ? d.zones
                : (d.lane ? [d.lane] : (d.zone ? [d.zone] : ['All Lanes']));
            const cleanZones = rawZones.map(normaliseShortZone);
            const laneVal = cleanZones[0] || 'All Lanes';
            const isAll = Boolean(
                d.isEntirePool ||
                laneVal === 'All Lanes' ||
                cleanZones.includes('All Lanes') ||
                cleanZones.includes('Entire Zone')
            );
            const isManual = Boolean(
                d.isManualOverride ||
                d.isDirective ||
                d.type === 'CLOSURE' ||
                d.category === 'Maintenance Closure'
            );

            return {
                id: doc.id,
                firestoreDocId: doc.id,
                ...d,
                startDateTime: sDate,
                endDateTime: eDate,
                pool: poolId,
                lane: laneVal,
                zone: d.zone || laneVal,
                zones: cleanZones,
                isEntirePool: isAll,
                isManualOverride: isManual,
                isDirective: isManual
            };
        };

        // Clean interval slicer for Admin Timeline Inspector so directives override bookings cleanly without overlap
        const buildAdminLaneEventSegments = (laneEvents, displayMin, displayMax) => {
            const points = new Set([displayMin, displayMax]);
            const parsed = laneEvents.map(evt => {
                const s = Math.max(displayMin, Math.min(displayMax, parseTimeToDecimal(evt.startTime, evt.startDateTime)));
                const e = Math.max(displayMin, Math.min(displayMax, parseTimeToDecimal(evt.endTime, evt.endDateTime)));
                if (e > s + 0.01) {
                    points.add(Number(s.toFixed(4)));
                    points.add(Number(e.toFixed(4)));
                }
                return { evt, s, e, isManual: Boolean(evt.isManualOverride || evt.isDirective) };
            }).filter(x => x.e > x.s + 0.01);

            const sortedPts = Array.from(points).sort((a, b) => a - b);
            const rawSlices = [];

            for (let i = 0; i < sortedPts.length - 1; i++) {
                const sliceStart = sortedPts[i];
                const sliceEnd = sortedPts[i + 1];
                if (sliceEnd - sliceStart < 0.01) continue;
                const mid = (sliceStart + sliceEnd) / 2;

                const covering = parsed.filter(item => item.s <= mid && item.e >= mid);
                if (covering.length > 0) {
                    covering.sort((a, b) => {
                        if (a.isManual !== b.isManual) return a.isManual ? -1 : 1;
                        return b.s - a.s;
                    });
                    rawSlices.push({
                        start: sliceStart,
                        end: sliceEnd,
                        event: covering[0].evt
                    });
                }
            }

            const merged = [];
            rawSlices.forEach(slice => {
                const prev = merged[merged.length - 1];
                if (prev && prev.event.id === slice.event.id && Math.abs(prev.end - slice.start) < 0.01) {
                    prev.end = slice.end;
                } else {
                    merged.push({ ...slice });
                }
            });

            return merged;
        };

        // --- LOGIN SCREEN ---
        const CRACLoginScreen = ({ onAuthSuccess }) => {

            return (

                            </p>

                                50m Olympic • 25m Indoor • Program Pool
                            </span>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-extrabold text-slate-700 uppercase tracking-wide mb-1.5">
                                    Access Password
                                </label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={e => setPassword(e.target.value)}
                                    className="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none font-medium transition"
                                    placeholder="Enter CRAC duty manager password"
                                    autoFocus
                                />
                            </div>

                            {error && (
                                <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl text-rose-800 text-xs font-bold flex items-start gap-2">
                                    <Icons.Warning size={16} className="text-rose-600 shrink-0 mt-0.5" />
                                    <span>{error}</span>
                                </div>
                            )}

                            <button
                                type="submit"
                                disabled={isLoggingIn}
                                className="w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white rounded-xl font-black text-sm transition shadow-md shadow-blue-500/20 disabled:opacity-50 flex items-center justify-center gap-2">
                                {isLoggingIn ? (
                                    <>
                                        <div className="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></div>
                                        <span>Authorising CRAC Session...</span>
                                    </>
                                ) : (
                                    <>
                                        <Icons.ShieldCheck size={18} />
                                        <span>Sign In to CRAC Console</span>
                                    </>
                                )}
                            </button>
                        </form>

                        <div className="mt-6 pt-4 border-t border-slate-100 text-center">
                            <p className="text-[11px] font-semibold text-slate-400">
                                Authorises with CRAC Operations credentials (<code className="text-slate-600 font-mono">info@clarenceregionalaquaticcentre.com.au</code>).
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN CRAC DUTY MANAGER PORTAL ---
        const CRACDutyManagerPortal = ({ onLogout }) => {
            const [selectedPoolId, setSelectedPoolId] = useState(CRAC_POOLS[0].id);
            const [selectedDate, setSelectedDate] = useState(new Date());

            const activePool = CRAC_POOLS.find(p => p.id === selectedPoolId) || CRAC_POOLS[0];

            // Live Grafton AEST Clock
            const [currentTimeStr, setCurrentTimeStr] = useState(() => new Date().toLocaleTimeString('en-AU', { timeZone: 'Australia/Sydney', hour: '2-digit', minute: '2-digit', second: '2-digit' }));
            useEffect(() => {
                const timer = setInterval(() => {
                    setCurrentTimeStr(new Date().toLocaleTimeString('en-AU', { timeZone: 'Australia/Sydney', hour: '2-digit', minute: '2-digit', second: '2-digit' }));
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            // CRAC Operating Hours Limits
            const seasonRules = window.CRAC_SEASON_LOGIC || (window.getSeasonLogic && window.getSeasonLogic('CRAC'));
            const operatingStatus = seasonRules ? seasonRules.getOperatingStatus(selectedDate, activePool.id) : { open: true, openHour: 5.5, closeHour: 19 };
            const hoursLimits = seasonRules ? seasonRules.getDisplayHoursLimits(selectedDate) : { min: 5, max: 19 };

            const displayMin = Math.min(hoursLimits.min, operatingStatus.openHour || 5.5);
            const displayMax = Math.max(hoursLimits.max, operatingStatus.closeHour || 19);
            const totalHours = Math.max(1, displayMax - displayMin);

            const hoursList = [];
            for (let h = Math.floor(displayMin); h <= Math.ceil(displayMax); h++) {
                hoursList.push(h);
            }

            // Local & Dual Cloud State
            const [syncData, setSyncData] = useState(() => syncEngine.getConsolidatedSchedule('CRAC'));
            const [primaryEvents, setPrimaryEvents] = useState([]);
            const [secondaryEvents, setSecondaryEvents] = useState([]);
            const [localDirectives, setLocalDirectives] = useState([]);
            const [dbStatus, setDbStatus] = useState("Connecting Live Cloud...");
            const [broadcastNotice, setBroadcastNotice] = useState(null);

            const broadcastChange = useCallback((msg) => {
                try {
                    const channel = new BroadcastChannel(CRAC_CONFIG.broadcastChannelName);
                    channel.postMessage({ type: 'MANUAL_CLOSURE_UPDATED', venue: 'CRAC', message: msg, timestamp: Date.now() });
                    channel.close();
                } catch (e) {
                    // Fallback
                }
                setBroadcastNotice(msg);
                setTimeout(() => setBroadcastNotice(null), 3500);
            }, []);

            // Dual Firestore real-time listeners for crac_calendar_events_v2
            useEffect(() => {
                const unsubs = [];
                if (auth && !auth.currentUser) {
                    auth.signInAnonymously().catch(() => {});
                }
                if (prodAuth && !prodAuth.currentUser) {
                    prodAuth.signInWithEmailAndPassword('yambapool@clarence.nsw.gov.au', 'YCP*26*').catch(() => {});
                }

                if (db) {
                    unsubs.push(
                        db.collection(CRAC_CONFIG.eventsCollection).onSnapshot(snapshot => {
                            setPrimaryEvents(snapshot.docs.map(normaliseFirestoreDoc));
                            setDbStatus("Live Cloud Sync (Firestore)");
                        }, err => console.warn("Primary CRAC Firestore notice:", err))
                    );
                }

                if (prodDb) {
                    unsubs.push(
                        prodDb.collection(CRAC_CONFIG.eventsCollection).onSnapshot(snapshot => {
                            setSecondaryEvents(snapshot.docs.map(normaliseFirestoreDoc));
                            setDbStatus("Live Cloud Sync (Firestore)");
                        }, err => console.warn("Secondary CRAC Firestore notice:", err))
                    );
                }

                return () => unsubs.forEach(u => u && u());
            }, []);

            const firestoreEvents = useMemo(() => {
                const map = new Map();
                secondaryEvents.forEach(ev => map.set(ev.id, ev));
                primaryEvents.forEach(ev => map.set(ev.id, ev));
                return Array.from(map.values());
            }, [primaryEvents, secondaryEvents]);

            const dateStr = localDateKey(selectedDate);
            const activeClosures = useMemo(() => {
                const localOverrides = (syncData.events || []).filter(e => e.isManualOverride || e.isDirective);
                const cloudDirectives = firestoreEvents.filter(e => e.isManualOverride || e.isDirective);
                const map = new Map();
                [...localDirectives, ...localOverrides, ...cloudDirectives].forEach(ev => {
                    if (!ev || !ev.id) return;
                    const evDate = ev.date || localDateKey(ev.startDateTime);
                    if (evDate === dateStr) {
                        map.set(ev.id, ev);
                    }
                });
                return Array.from(map.values());
            }, [syncData, firestoreEvents, localDirectives, dateStr]);

            // Custom Directive Modal State
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [formTitle, setFormTitle] = useState('');
            const [formPoolId, setFormPoolId] = useState(CRAC_POOLS[0].id);
            const [formPriority, setFormPriority] = useState('Critical Closure');
            const [formSelectedZones, setFormSelectedZones] = useState([]);
            const [formStartDate, setFormStartDate] = useState(() => localDateKey(new Date()));
            const [formStartTime, setFormStartTime] = useState('09:00');
            const [formEndTime, setFormEndTime] = useState('11:00');
            const [formReason, setFormReason] = useState('');
            const [formIsEntirePool, setFormIsEntirePool] = useState(false);

            const activeFormPool = CRAC_POOLS.find(p => p.id === formPoolId) || CRAC_POOLS[0];

            const toggleZone = (lane) => {
                if (formSelectedZones.includes(lane)) {
                    setFormSelectedZones(formSelectedZones.filter(z => z !== lane));
                } else {
                    setFormSelectedZones([...formSelectedZones, lane]);
                }
            };

            const selectAllLanes = () => {
                setFormSelectedZones([...activeFormPool.lanes]);
                setFormIsEntirePool(true);
            };

            const clearAllLanes = () => {
                setFormSelectedZones([]);
                setFormIsEntirePool(false);
            };

            const getSmartDefaultStartTime = () => {
                const now = new Date();
                const nowDec = now.getHours() + now.getMinutes() / 60;
                if (nowDec >= displayMin && nowDec <= displayMax - 0.5) {
                    return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                }
                return '09:00';
            };

            // Preset Emergency Directives Customisation Modal State
            const [presetModal, setPresetModal] = useState({
                isOpen: false,
                type: 'LIGHTNING',
                title: 'Thunderstorm / Lightning Evacuation',
                priority: 'Critical Closure',
                startTime: '09:00',
                durationMinutes: 30,
                reason: 'Lightning detected within 10 km. Facility safety evacuation mandated.',
                targetPoolId: activePool.id,
                targetLanes: [...activePool.lanes],
                isEntire: true
            });

            const openPresetConfig = (type) => {
                const defaultStart = getSmartDefaultStartTime();
                if (type === 'LIGHTNING') {
                    setPresetModal({
                        isOpen: true,
                        type: 'LIGHTNING',
                        title: 'Thunderstorm / Lightning Evacuation',
                        priority: 'Critical Closure',
                        startTime: defaultStart,
                        durationMinutes: 30,
                        reason: 'Lightning detected within 10 km. Facility safety evacuation mandated.',
                        targetPoolId: activePool.id,
                        targetLanes: [...activePool.lanes],
                        isEntire: true
                    });
                } else if (type === 'REMEDIATION') {
                    setPresetModal({
                        isOpen: true,
                        type: 'REMEDIATION',
                        title: 'Water Quality Remediation',
                        priority: 'Operational Notice',
                        startTime: defaultStart,
                        durationMinutes: 120,
                        reason: 'Unscheduled chemical remediation and water testing in progress.',
                        targetPoolId: activePool.id,
                        targetLanes: activePool.lanes.slice(0, 2),
                        isEntire: false
                    });
                } else if (type === 'MAINTENANCE') {
                    setPresetModal({
                        isOpen: true,
                        type: 'MAINTENANCE',
                        title: 'Lane & Block Maintenance',
                        priority: 'Maintenance',
                        startTime: defaultStart,
                        durationMinutes: 60,
                        reason: 'Routine starting block and lane rope tension maintenance.',
                        targetPoolId: activePool.id,
                        targetLanes: [activePool.lanes[0]],
                        isEntire: false
                    });
                } else if (type === 'CARNIVAL') {
                    setPresetModal({
                        isOpen: true,
                        type: 'CARNIVAL',
                        title: 'School Carnival Reservation',
                        priority: 'School Carnival',
                        startTime: defaultStart,
                        durationMinutes: 240,
                        reason: 'School swimming carnival setup and dedicated event zones.',
                        targetPoolId: activePool.id,
                        targetLanes: [...activePool.lanes],
                        isEntire: true
                    });
                }
            };

            const writeDirectiveToCloud = async (directiveId, payload) => {
                const tasks = [];
                if (db) {
                    tasks.push(
                        db.collection(CRAC_CONFIG.eventsCollection).doc(directiveId).set(payload, { merge: true })
                            .catch(e => console.warn("Primary Firestore write warning:", e))
                    );
                }
                if (prodDb) {
                    tasks.push(
                        prodDb.collection(CRAC_CONFIG.eventsCollection).doc(directiveId).set(payload, { merge: true })
                            .catch(e => console.warn("Secondary Firestore write warning:", e))
                    );
                }
                await Promise.all(tasks);
            };

            const executePresetDirective = async () => {
                const startParts = (presetModal.startTime || '09:00').split(':');
                const startH = parseInt(startParts[0], 10) || 9;
                const startM = parseInt(startParts[1], 10) || 0;

                const sDate = new Date(selectedDate);
                sDate.setHours(startH, startM, 0, 0);

                const duration = Math.max(5, parseInt(presetModal.durationMinutes, 10) || 30);
                const eDate = new Date(sDate.getTime() + duration * 60000);
                const pad = (n) => String(n).padStart(2, '0');
                const startTime = `${pad(sDate.getHours())}:${pad(sDate.getMinutes())}`;
                const endTime = `${pad(eDate.getHours())}:${pad(eDate.getMinutes())}`;

                const targetPool = CRAC_POOLS.find(p => p.id === presetModal.targetPoolId) || activePool;
                const targetLanes = presetModal.isEntire ? targetPool.lanes : (presetModal.targetLanes.length ? presetModal.targetLanes : [targetPool.lanes[0]]);
                const directiveId = 'DIR-CRAC-' + Date.now();

                const newDirective = {
                    id: directiveId,
                    firestoreDocId: directiveId,
                    venue: 'CRAC',
                    date: localDateKey(sDate),
                    title: presetModal.title,
                    category: 'Maintenance Closure',
                    priority: presetModal.priority,
                    pool: targetPool.id,
                    lane: presetModal.isEntire ? 'All Lanes' : targetLanes.join(', '),
                    zone: presetModal.isEntire ? 'All Lanes' : targetLanes.join(', '),
                    zones: targetLanes,
                    isEntirePool: Boolean(presetModal.isEntire),
                    startDateTime: sDate.toISOString(),
                    endDateTime: eDate.toISOString(),
                    startTime: startTime,
                    endTime: endTime,
                    reason: presetModal.reason.trim() || 'Duty Manager Directive',
                    isManualOverride: true,
                    isDirective: true,
                    createdAt: new Date().toISOString()
                };

                syncEngine.addManualClosure(newDirective);
                setSyncData(syncEngine.getConsolidatedSchedule('CRAC'));
                setLocalDirectives(prev => [newDirective, ...prev.filter(d => d.id !== directiveId)]);

                setPresetModal(prev => ({ ...prev, isOpen: false }));
                broadcastChange(`Published CRAC directive: ${presetModal.title} (${startTime} to ${endTime})`);

                await writeDirectiveToCloud(directiveId, {
                    ...newDirective,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            };

            const handleSaveCustomDirective = async (e) => {
                e.preventDefault();
                if (!formTitle.trim()) return;

                const startDt = new Date(`${formStartDate}T${formStartTime}:00`);
                const endDt = new Date(`${formStartDate}T${formEndTime}:00`);

                if (endDt <= startDt) {
                    alert('End time must be after start time.');
                    return;
                }

                const zonesToAssign = formIsEntirePool ? activeFormPool.lanes : (formSelectedZones.length ? formSelectedZones : [activeFormPool.lanes[0]]);
                const directiveId = 'DIR-CRAC-' + Date.now();

                const newDirective = {
                    id: directiveId,
                    firestoreDocId: directiveId,
                    venue: 'CRAC',
                    date: formStartDate,
                    title: formTitle.trim(),
                    category: 'Maintenance Closure',
                    priority: formPriority,
                    pool: formPoolId,
                    lane: formIsEntirePool ? 'All Lanes' : zonesToAssign.join(', '),
                    zone: formIsEntirePool ? 'All Lanes' : zonesToAssign.join(', '),
                    zones: zonesToAssign,
                    isEntirePool: Boolean(formIsEntirePool),
                    startDateTime: startDt.toISOString(),
                    endDateTime: endDt.toISOString(),
                    startTime: formStartTime,
                    endTime: formEndTime,
                    reason: formReason.trim() || 'Duty Manager Operational Directive',
                    isManualOverride: true,
                    isDirective: true,
                    createdAt: new Date().toISOString()
                };

                syncEngine.addManualClosure(newDirective);
                setSyncData(syncEngine.getConsolidatedSchedule('CRAC'));
                setLocalDirectives(prev => [newDirective, ...prev.filter(d => d.id !== directiveId)]);

                setIsModalOpen(false);
                setFormTitle('');
                setFormReason('');
                setFormSelectedZones([]);
                setFormIsEntirePool(false);
                broadcastChange(`Published CRAC directive: ${newDirective.title}`);

                await writeDirectiveToCloud(directiveId, {
                    ...newDirective,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            };

            // Remove Directive (1-click Re-open)
            const handleRemoveClosure = async (closureId, firestoreDocId) => {
                const targetId = firestoreDocId || closureId;
                syncEngine.removeManualClosure(closureId);
                setSyncData(syncEngine.getConsolidatedSchedule('CRAC'));
                setLocalDirectives(prev => prev.filter(d => d.id !== closureId && d.firestoreDocId !== closureId && d.id !== targetId));
                setPrimaryEvents(prev => prev.filter(d => d.id !== closureId && d.firestoreDocId !== closureId && d.id !== targetId));
                setSecondaryEvents(prev => prev.filter(d => d.id !== closureId && d.firestoreDocId !== closureId && d.id !== targetId));

                broadcastChange('CRAC Zone re-opened: Directive cleared');

                const tasks = [];
                if (db) {
                    tasks.push(db.collection(CRAC_CONFIG.eventsCollection).doc(targetId).delete().catch(() => {}));
                }
                if (prodDb) {
                    tasks.push(prodDb.collection(CRAC_CONFIG.eventsCollection).doc(targetId).delete().catch(() => {}));
                }
                await Promise.all(tasks);
            };

            // Pool events for selected date and strictly matching activePool.id (no fake seed events, no cross-pool bleed)
            const poolEvents = useMemo(() => {
                const localManuals = (syncData.events || []).filter(e => e && (e.isManualOverride || e.isDirective));
                const combined = [...localDirectives, ...localManuals, ...firestoreEvents];
                const seen = new Set();
                return combined.filter(ev => {
                    if (!ev || !ev.id || seen.has(ev.id)) return false;
                    seen.add(ev.id);
                    if (ev.pool !== activePool.id && ev.pool !== 'All Pools') return false;
                    const evStartKey = ev.date || localDateKey(ev.startDateTime);
                    return evStartKey === dateStr;
                });
            }, [localDirectives, syncData, firestoreEvents, activePool, dateStr]);

            return (
                <div className="max-w-[1500px] w-full mx-auto space-y-5">
                    {/* Header */}
                    <header className="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200/90 shadow-sm flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                        <div className="flex items-center gap-3">
                            <div className="w-12 h-12 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-md shadow-blue-500/20">
                                <Icons.Waves size={26} />
                            </div>
                            <div>
                                <div className="flex items-center gap-2">
                                    <h1 className="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">
                                        Clarence Regional Aquatic Centre
                                    </h1>
                                    <span className="px-2.5 py-0.5 rounded-full text-[11px] font-extrabold uppercase tracking-wide bg-blue-100 text-blue-800 border border-blue-200">
                                        Duty Manager
                                    </span>
                                </div>
                                <p className="text-xs font-semibold text-slate-500 mt-0.5 flex items-center gap-1.5">
                                    <Icons.MapPin size={13} className="text-blue-600" />
                                    <span>Grafton, NSW (Club ID 1)</span>
                                    <span>•</span>
                                    <span>50m Olympic, 25m Heated &amp; Program Pools</span>
                                </p>
                            </div>
                        </div>

                        <div className="flex flex-wrap items-center gap-2 sm:gap-3">
                            <div className="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-700 flex items-center gap-1.5">
                                <Icons.Clock size={16} className="text-blue-600" />
                                <span className="tabular-nums">{currentTimeStr}</span>
                                <span className="text-[10px] text-slate-400 uppercase">AEST</span>
                            </div>

                            <div className="px-3 py-1.5 bg-emerald-50 border border-emerald-200 rounded-xl text-xs font-bold text-emerald-800 flex items-center gap-1.5">
                                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                <span>{dbStatus}</span>
                            </div>

                            <a
                                href="crac-cal-embed-v2.html"
                                target="_blank"
                                rel="noreferrer"
                                className="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition flex items-center gap-1.5 border border-slate-200"
                                title="Open CRAC Patron Public Embed">
                                <Icons.ArrowSquareOut size={16} />
                                <span>Patron Display</span>
                            </a>

                            <button
                                onClick={onLogout}
                                className="px-3.5 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
                                <Icons.SignOut size={16} />
                                <span>Logout</span>
                            </button>
                        </div>
                    </header>

                    {/* Broadcast Notification Alert */}
                    {broadcastNotice && (
                        <div className="bg-blue-600 text-white px-4 py-3 rounded-xl shadow-lg flex items-center justify-between text-sm font-bold animate-bounce">
                            <div className="flex items-center gap-2">
                                <Icons.Broadcast size={20} className="animate-pulse" />
                                <span>{broadcastNotice}</span>
                            </div>
                            <span className="text-xs bg-blue-700 px-2 py-0.5 rounded text-blue-100">Live Synchronised</span>
                        </div>
                    )}

                    {/* Quick Emergency Directives Ribbon */}
                    <div className="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-sm">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-3">
                            <div>
                                <h2 className="text-base font-extrabold text-slate-900 flex items-center gap-2">
                                    <Icons.Warning size={20} className="text-amber-500" />
                                    <span>CRAC Emergency Directives</span>
                                </h2>
                                <p className="text-xs text-slate-500 font-medium">
                                    Target pool: <strong>{activePool.name}</strong>. Trigger instant evacuations or closures.
                                </p>
                            </div>
                            <button
                                onClick={() => setIsModalOpen(true)}
                                className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-extrabold transition flex items-center justify-center gap-1.5 shadow-sm shadow-blue-500/20 active:scale-95">
                                <Icons.Plus size={16} />
                                <span>Custom Directive</span>
                            </button>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                            <button
                                onClick={() => openPresetConfig('LIGHTNING')}
                                className="p-3.5 bg-rose-50 hover:bg-rose-100/80 border border-rose-200 rounded-xl text-left transition flex items-start gap-3 group active:scale-95 shadow-2xs">
                                <div className="p-2.5 bg-rose-600 text-white rounded-xl group-hover:scale-105 transition shadow-sm">
                                    <Icons.Lightning size={20} />
                                </div>
                                <div>
                                    <div className="flex items-center gap-1.5">
                                        <h3 className="font-extrabold text-slate-900 text-xs">Lightning Evac</h3>
                                        <span className="text-[10px] font-black bg-rose-200 text-rose-800 px-1.5 py-0.2 rounded">Set Duration</span>
                                    </div>
                                    <p className="text-[11px] text-slate-600 font-medium mt-0.5">
                                        Evacuate {activePool.shortName} for storm within 10 km.
                                    </p>
                                </div>
                            </button>

                            <button
                                onClick={() => openPresetConfig('REMEDIATION')}
                                className="p-3.5 bg-amber-50 hover:bg-amber-100/80 border border-amber-200 rounded-xl text-left transition flex items-start gap-3 group active:scale-95 shadow-2xs">
                                <div className="p-2.5 bg-amber-600 text-white rounded-xl group-hover:scale-105 transition shadow-sm">
                                    <Icons.FirstAid size={20} />
                                </div>
                                <div>
                                    <div className="flex items-center gap-1.5">
                                        <h3 className="font-extrabold text-slate-900 text-xs">Water Remediation</h3>
                                        <span className="text-[10px] font-black bg-amber-200 text-amber-800 px-1.5 py-0.2 rounded">Set Duration</span>
                                    </div>
                                    <p className="text-[11px] text-slate-600 font-medium mt-0.5">
                                        Close edge lanes for chemical dosing &amp; testing.
                                    </p>
                                </div>
                            </button>

                            <button
                                onClick={() => openPresetConfig('MAINTENANCE')}
                                className="p-3.5 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl text-left transition flex items-start gap-3 group active:scale-95 shadow-2xs">
                                <div className="p-2.5 bg-slate-700 text-white rounded-xl group-hover:scale-105 transition shadow-sm">
                                    <Icons.Wrench size={20} />
                                </div>
                                <div>
                                    <div className="flex items-center gap-1.5">
                                        <h3 className="font-extrabold text-slate-900 text-xs">Block Maintenance</h3>
                                        <span className="text-[10px] font-black bg-slate-200 text-slate-800 px-1.5 py-0.2 rounded">Set Duration</span>
                                    </div>
                                    <p className="text-[11px] text-slate-600 font-medium mt-0.5">
                                        Close lane 1 for block and rope repairs.
                                    </p>
                                </div>
                            </button>

                            <button
                                onClick={() => openPresetConfig('CARNIVAL')}
                                className="p-3.5 bg-purple-50 hover:bg-purple-100/80 border border-purple-200 rounded-xl text-left transition flex items-start gap-3 group active:scale-95 shadow-2xs">
                                <div className="p-2.5 bg-purple-600 text-white rounded-xl group-hover:scale-105 transition shadow-sm">
                                    <Icons.Swimmer size={20} />
                                </div>
                                <div>
                                    <div className="flex items-center gap-1.5">
                                        <h3 className="font-extrabold text-slate-900 text-xs">Carnival Booking</h3>
                                        <span className="text-[10px] font-black bg-purple-200 text-purple-800 px-1.5 py-0.2 rounded">Set Duration</span>
                                    </div>
                                    <p className="text-[11px] text-slate-600 font-medium mt-0.5">
                                        Reserve entire {activePool.shortName} for carnival.
                                    </p>
                                </div>
                            </button>
                        </div>
                    </div>

                    {/* Operational Layout */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
                        {/* Left 2 Cols: Timeline Inspector */}
                        <div className="lg:col-span-2 space-y-4">
                            <div className="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-sm space-y-4">
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-100">
                                    {/* Pool Selection Tabs */}
                                    <div className="flex flex-wrap gap-2">
                                        {CRAC_POOLS.map(pool => (
                                            <button
                                                key={pool.id}
                                                onClick={() => setSelectedPoolId(pool.id)}
                                                className={`px-3.5 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-1.5 ${
                                                    selectedPoolId === pool.id
                                                        ? 'bg-blue-600 text-white shadow-sm shadow-blue-500/20'
                                                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                                }`}>
                                                <Icons.Waves size={16} />
                                                <span>{pool.name}</span>
                                                <span className={`text-[10px] px-1.5 py-0.2 rounded font-bold ${
                                                    selectedPoolId === pool.id ? 'bg-blue-700 text-white' : 'bg-slate-200 text-slate-700'
                                                }`}>
                                                    {pool.capacity} {pool.unit}
                                                </span>
                                            </button>
                                        ))}
                                    </div>

                                    {/* Date Selector */}
                                    <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-xl">
                                        <button
                                            onClick={() => {
                                                const prev = new Date(selectedDate);
                                                prev.setDate(prev.getDate() - 1);
                                                setSelectedDate(prev);
                                            }}
                                            className="p-1.5 hover:bg-white rounded-lg text-slate-600 transition"
                                            title="Previous Day">
                                            <Icons.ChevronLeft size={16} />
                                        </button>
                                        <button
                                            onClick={() => setSelectedDate(new Date())}
                                            className="px-2.5 py-1 text-xs font-extrabold hover:bg-white rounded-lg text-slate-700 transition">
                                            Today
                                        </button>
                                        <button
                                            onClick={() => {
                                                const next = new Date(selectedDate);
                                                next.setDate(next.getDate() + 1);
                                                setSelectedDate(next);
                                            }}
                                            className="p-1.5 hover:bg-white rounded-lg text-slate-600 transition"
                                            title="Next Day">
                                            <Icons.ChevronRight size={16} />
                                        </button>
                                        <span className="text-xs font-bold text-slate-700 px-2">
                                            {selectedDate.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' })}
                                        </span>
                                    </div>
                                </div>

                                {/* Timeline Visualiser */}
                                <div className="border border-slate-200 rounded-xl overflow-hidden bg-slate-50/50">
                                    <div className="overflow-x-auto custom-scrollbar">
                                        <div className="min-w-[760px]">
                                            <div className="flex border-b border-slate-200 bg-white">
                                                <div className="w-28 sm:w-32 shrink-0 p-2.5 text-xs font-extrabold text-slate-500 uppercase tracking-wider border-r border-slate-200">
                                                    Zone
                                                </div>
                                                <div className="flex-1 flex">
                                                    {hoursList.map(hour => (
                                                        <div key={hour} className="flex-1 text-center py-2 text-[11px] font-bold text-slate-500 border-r border-slate-100 last:border-r-0">
                                                            {formatOperatingTime(hour)}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            <div className="divide-y divide-slate-200 bg-white">
                                                {activePool.lanes.map(lane => {
                                                    const laneEvents = poolEvents.filter(ev => {
                                                        if (ev.isEntirePool || ev.lane === 'All Lanes' || ev.zone === 'All Lanes') return true;
                                                        if (Array.isArray(ev.zones)) return ev.zones.includes(lane) || ev.zones.includes('All Lanes') || ev.zones.includes('Entire Zone');
                                                        return ev.zone === lane || ev.lane === lane;
                                                    });

                                                    const cleanSlices = buildAdminLaneEventSegments(laneEvents, displayMin, displayMax);

                                                    return (
                                                        <div key={lane} className="flex min-h-[50px] relative hover:bg-slate-50/60 transition">
                                                            <div className="w-28 sm:w-32 shrink-0 p-2.5 border-r border-slate-200 bg-slate-50/40 flex flex-col justify-center">
                                                                <span className="text-xs font-black text-slate-800">{lane}</span>
                                                                <span className="text-[10px] text-slate-400 font-semibold truncate">
                                                                    {activePool.shortName}
                                                                </span>
                                                            </div>

                                                            <div className="flex-1 relative flex">
                                                                {hoursList.map(h => (
                                                                    <div key={h} className="flex-1 border-r border-slate-100/70 h-full pointer-events-none"></div>
                                                                ))}

                                                                {cleanSlices.map((slice, sIdx) => {
                                                                    const event = slice.event;
                                                                    const clampedStart = Math.max(displayMin, Math.min(displayMax, slice.start));
                                                                    const clampedEnd = Math.max(displayMin, Math.min(displayMax, slice.end));

                                                                    if (clampedEnd <= clampedStart) return null;

                                                                    const leftPct = ((clampedStart - displayMin) / totalHours) * 100;
                                                                    const widthPct = Math.max(2, ((clampedEnd - clampedStart) / totalHours) * 100);

                                                                    const isManual = event.isManualOverride || event.isDirective;
                                                                    const categoryKey = isManual ? 'Maintenance Closure' : (event.category || 'Bookings');
                                                                    const style = CATEGORY_STYLES[categoryKey] || CATEGORY_STYLES['Default'];

                                                                    return (
                                                                        <div
                                                                            key={`${event.id}-${sIdx}`}
                                                                            style={{
                                                                                left: `${leftPct}%`,
                                                                                width: `${widthPct}%`
                                                                            }}
                                                                            className={`absolute top-1 bottom-1 rounded-lg px-2 flex items-center justify-between text-xs font-bold border transition shadow-sm overflow-hidden ${
                                                                                isManual ? 'hazard-stripes-bold border-rose-500 text-rose-950 z-30 ring-1 ring-rose-400' : `${style.bg} ${style.border} ${style.text} z-10`
                                                                            }`}>
                                                                            <div className="truncate flex items-center gap-1.5">
                                                                                <span className={`w-1.5 h-1.5 rounded-full shrink-0 ${isManual ? 'bg-rose-600 animate-pulse' : style.dot}`}></span>
                                                                                <span className="truncate">{event.title}</span>
                                                                            </div>
                                                                            {isManual && (
                                                                                <button
                                                                                    onClick={(e) => {
                                                                                        e.stopPropagation();
                                                                                        handleRemoveClosure(event.id, event.firestoreDocId);
                                                                                    }}
                                                                                    className="ml-1 p-1 bg-white/90 hover:bg-rose-600 hover:text-white text-rose-700 rounded text-[10px] font-extrabold transition shadow-xs shrink-0"
                                                                                    title="Re-open this zone now">
                                                                                    Clear
                                                                                </button>
                                                                            )}
                                                                        </div>
                                                                    );
                                                                })}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Right Col: Active Directives */}
                        <div className="space-y-4">
                            <div className="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-sm">
                                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                                    <h3 className="font-extrabold text-slate-900 text-sm flex items-center gap-2">
                                        <Icons.Warning size={18} className="text-rose-500" />
                                        <span>Active CRAC Directives</span>
                                    </h3>
                                    <span className="text-xs font-extrabold px-2 py-0.5 rounded-full bg-rose-100 text-rose-800">
                                        {activeClosures.length} Active
                                    </span>
                                </div>

                                {activeClosures.length === 0 ? (
                                    <div className="py-10 text-center text-slate-400">
                                        <Icons.CheckCircle size={36} className="mx-auto text-emerald-500 mb-2 opacity-80" />
                                        <p className="font-extrabold text-slate-700 text-sm">All CRAC Zones Normal</p>
                                        <p className="text-xs text-slate-400 mt-1 max-w-[200px] mx-auto font-medium">
                                            No active emergency directives or manual lane closures in force.
                                        </p>
                                    </div>
                                ) : (
                                    <div className="space-y-3 mt-3 max-h-[500px] overflow-y-auto custom-scrollbar pr-1">
                                        {activeClosures.map(closure => (
                                            <div
                                                key={closure.id}
                                                className="p-3.5 bg-rose-50/70 border border-rose-200 rounded-xl space-y-2 text-xs">
                                                <div className="flex items-start justify-between gap-2">
                                                    <div>
                                                        <span className="text-[10px] font-black uppercase tracking-wider px-1.5 py-0.5 rounded bg-rose-200 text-rose-900">
                                                            {closure.isEntirePool ? 'Full Pool Closure' : 'Zone Closure'}
                                                        </span>
                                                        <h4 className="font-black text-slate-900 text-sm mt-1">{closure.title}</h4>
                                                    </div>
                                                    <button
                                                        onClick={() => handleRemoveClosure(closure.id, closure.firestoreDocId)}
                                                        className="px-2.5 py-1 bg-white hover:bg-emerald-600 hover:text-white text-emerald-700 border border-emerald-300 rounded-lg font-black text-xs transition flex items-center gap-1 active:scale-95 shadow-xs"
                                                        title="Re-open zone immediately">
                                                        <Icons.CheckCircle size={14} />
                                                        <span>Re-open</span>
                                                    </button>
                                                </div>

                                                <p className="text-slate-700 font-medium leading-relaxed">
                                                    {closure.reason}
                                                </p>

                                                <div className="pt-2 border-t border-rose-200/80 flex items-center justify-between text-[11px] font-bold text-slate-600">
                                                    <span>Target: <strong>{closure.pool} ({closure.zones?.join(', ') || 'All'})</strong></span>
                                                    <span>Slot: <strong>{closure.startTime} to {closure.endTime || new Date(closure.endDateTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</strong></span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Preset Directive Customisation Modal */}
                    {presetModal.isOpen && (() => {
                        const targetPool = CRAC_POOLS.find(p => p.id === presetModal.targetPoolId) || activePool;
                        return (
                            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                                <div className="bg-white rounded-2xl max-w-lg w-full p-6 border border-slate-200 shadow-2xl modal-enter space-y-4">
                                    <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                                        <div className="flex items-center gap-3">
                                            <div className={`p-2.5 rounded-xl text-white shadow-sm ${
                                                presetModal.type === 'LIGHTNING' ? 'bg-rose-600' :
                                                presetModal.type === 'REMEDIATION' ? 'bg-amber-600' :
                                                presetModal.type === 'MAINTENANCE' ? 'bg-slate-700' : 'bg-purple-600'
                                            }`}>
                                                {presetModal.type === 'LIGHTNING' && <Icons.Lightning size={22} />}
                                                {presetModal.type === 'REMEDIATION' && <Icons.FirstAid size={22} />}
                                                {presetModal.type === 'MAINTENANCE' && <Icons.Wrench size={22} />}
                                                {presetModal.type === 'CARNIVAL' && <Icons.Swimmer size={22} />}
                                            </div>
                                            <div>
                                                <span className={`text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded-full ${
                                                    presetModal.priority === 'Critical Closure' ? 'bg-rose-100 text-rose-800 border border-rose-200' :
                                                    presetModal.priority === 'Operational Notice' ? 'bg-amber-100 text-amber-800 border border-amber-200' :
                                                    presetModal.priority === 'School Carnival' ? 'bg-purple-100 text-purple-800 border border-purple-200' :
                                                    'bg-slate-100 text-slate-800 border border-slate-200'
                                                }`}>
                                                    {presetModal.priority}
                                                </span>
                                                <h3 className="text-base font-extrabold text-slate-900 mt-0.5">{presetModal.title}</h3>
                                            </div>
                                        </div>
                                        <button
                                            type="button"
                                            onClick={() => setPresetModal(prev => ({ ...prev, isOpen: false }))}
                                            className="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                                            <Icons.X size={20} />
                                        </button>
                                    </div>

                                    <div className="space-y-4">
                                        {/* 1. START TIME & DURATION SECTION */}
                                        <div className="bg-slate-50 border border-slate-200 rounded-xl p-3.5 space-y-2.5">
                                            <div className="flex items-center justify-between">
                                                <label className="text-xs font-black uppercase tracking-wider text-slate-700 flex items-center gap-1.5">
                                                    <Icons.Clock size={16} className="text-blue-600" />
                                                    <span>Start Time &amp; Duration</span>
                                                </label>
                                                <div className="flex items-center gap-2">
                                                    <input
                                                        type="time"
                                                        value={presetModal.startTime}
                                                        onChange={e => setPresetModal(prev => ({ ...prev, startTime: e.target.value }))}
                                                        className="px-2 py-0.5 bg-white border border-slate-300 rounded-md text-xs font-black text-slate-900"
                                                    />
                                                    <span className="text-xs font-black text-blue-700 bg-blue-100 px-2 py-0.5 rounded-md">
                                                        {presetModal.durationMinutes} Mins
                                                    </span>
                                                </div>
                                            </div>

                                            {/* Quick Duration Pills */}
                                            <div className="grid grid-cols-6 gap-1.5">
                                                {[15, 30, 45, 60, 90, 120].map(mins => (
                                                    <button
                                                        key={mins}
                                                        type="button"
                                                        onClick={() => setPresetModal(prev => ({ ...prev, durationMinutes: mins }))}
                                                        className={`py-1.5 rounded-lg text-xs font-black transition ${
                                                            Number(presetModal.durationMinutes) === mins
                                                                ? 'bg-blue-600 text-white shadow-xs'
                                                                : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-100'
                                                        }`}>
                                                        {mins >= 60 ? `${mins / 60}h` : `${mins}m`}
                                                    </button>
                                                ))}
                                            </div>

                                            {/* Custom Duration Input */}
                                            <div className="flex items-center gap-2">
                                                <button
                                                    type="button"
                                                    onClick={() => setPresetModal(prev => ({ ...prev, durationMinutes: Math.max(5, (Number(prev.durationMinutes) || 30) - 15) }))}
                                                    className="px-3 py-1.5 bg-white border border-slate-300 rounded-xl text-xs font-black text-slate-700 hover:bg-slate-100 active:scale-95 transition">
                                                    - 15m
                                                </button>
                                                <div className="relative flex-1">
                                                    <input
                                                        type="number"
                                                        min="5"
                                                        max="720"
                                                        step="5"
                                                        value={presetModal.durationMinutes}
                                                        onChange={e => setPresetModal(prev => ({ ...prev, durationMinutes: Math.max(1, parseInt(e.target.value, 10) || 0) }))}
                                                        className="w-full text-center px-3 py-1.5 bg-white border border-slate-300 rounded-xl text-sm font-black text-slate-900 focus:ring-2 focus:ring-blue-500 outline-none"
                                                        placeholder="Enter minutes"
                                                    />
                                                    <span className="absolute right-3 top-2 text-[11px] font-bold text-slate-400 pointer-events-none">mins</span>
                                                </div>
                                                <button
                                                    type="button"
                                                    onClick={() => setPresetModal(prev => ({ ...prev, durationMinutes: (Number(prev.durationMinutes) || 30) + 15 }))}
                                                    className="px-3 py-1.5 bg-white border border-slate-300 rounded-xl text-xs font-black text-slate-700 hover:bg-slate-100 active:scale-95 transition">
                                                    + 15m
                                                </button>
                                            </div>
                                        </div>

                                        {/* 2. TARGET POOL & LANES */}
                                        <div className="space-y-2">
                                            <div className="flex items-center justify-between">
                                                <label className="text-xs font-black uppercase tracking-wider text-slate-700">Target Pool</label>
                                                <div className="flex gap-1">
                                                    {CRAC_POOLS.map(p => (
                                                        <button
                                                            key={p.id}
                                                            type="button"
                                                            onClick={() => setPresetModal(prev => ({
                                                                ...prev,
                                                                targetPoolId: p.id,
                                                                targetLanes: [...p.lanes],
                                                                isEntire: true
                                                            }))}
                                                            className={`px-2 py-1 rounded-lg text-xs font-bold transition ${
                                                                presetModal.targetPoolId === p.id
                                                                    ? 'bg-blue-600 text-white'
                                                                    : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                                            }`}>
                                                            {p.name}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>

                                            <div className="flex items-center justify-between mb-1">
                                                <label className="text-[11px] font-bold text-slate-500">Affected Zones ({targetPool.name})</label>
                                                <div className="flex items-center gap-2">
                                                    <button
                                                        type="button"
                                                        onClick={() => setPresetModal(prev => ({ ...prev, isEntire: true, targetLanes: [...targetPool.lanes] }))}
                                                        className="text-[11px] font-bold text-blue-600 hover:underline">
                                                        All Zones
                                                    </button>
                                                    <span className="text-slate-300">•</span>
                                                    <button
                                                        type="button"
                                                        onClick={() => setPresetModal(prev => ({ ...prev, isEntire: false, targetLanes: [targetPool.lanes[0]] }))}
                                                        className="text-[11px] font-bold text-slate-500 hover:underline">
                                                        Single Zone
                                                    </button>
                                                </div>
                                            </div>
                                            <div className="flex flex-wrap gap-1 p-2 bg-slate-50 border border-slate-200 rounded-xl">
                                                {targetPool.lanes.map(lane => {
                                                    const isSelected = presetModal.isEntire || presetModal.targetLanes.includes(lane);
                                                    return (
                                                        <button
                                                            key={lane}
                                                            type="button"
                                                            onClick={() => {
                                                                if (presetModal.isEntire) {
                                                                    setPresetModal(prev => ({ ...prev, isEntire: false, targetLanes: [lane] }));
                                                                } else {
                                                                    const has = presetModal.targetLanes.includes(lane);
                                                                    const updated = has ? presetModal.targetLanes.filter(l => l !== lane) : [...presetModal.targetLanes, lane];
                                                                    setPresetModal(prev => ({ ...prev, targetLanes: updated.length ? updated : [lane] }));
                                                                }
                                                            }}
                                                            className={`px-2.5 py-1 rounded-lg text-xs font-black transition ${
                                                                isSelected
                                                                    ? (presetModal.type === 'LIGHTNING' ? 'bg-rose-600 text-white' : presetModal.type === 'REMEDIATION' ? 'bg-amber-600 text-white' : 'bg-blue-600 text-white')
                                                                    : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-100'
                                                            }`}>
                                                            {lane}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>

                                        {/* 3. PUBLIC REASON / NOTICE */}
                                        <div>
                                            <label className="block text-xs font-black uppercase tracking-wider text-slate-700 mb-1">
                                                Public Notice / Reason
                                            </label>
                                            <textarea
                                                rows="2"
                                                value={presetModal.reason}
                                                onChange={e => setPresetModal(prev => ({ ...prev, reason: e.target.value }))}
                                                className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-medium focus:ring-2 focus:ring-blue-500 outline-none"
                                            />
                                        </div>

                                        {/* 4. ACTIONS */}
                                        <div className="pt-2 flex items-center justify-end gap-2">
                                            <button
                                                type="button"
                                                onClick={() => setPresetModal(prev => ({ ...prev, isOpen: false }))}
                                                className="px-4 py-2 border border-slate-200 text-slate-600 rounded-xl text-xs font-bold hover:bg-slate-50 transition">
                                                Cancel
                                            </button>
                                            <button
                                                type="button"
                                                onClick={executePresetDirective}
                                                className={`px-5 py-2 text-white rounded-xl text-xs font-black transition shadow-md active:scale-95 flex items-center gap-1.5 ${
                                                    presetModal.type === 'LIGHTNING' ? 'bg-rose-600 hover:bg-rose-700 shadow-rose-500/20' :
                                                    presetModal.type === 'REMEDIATION' ? 'bg-amber-600 hover:bg-amber-700 shadow-amber-500/20' :
                                                    presetModal.type === 'MAINTENANCE' ? 'bg-slate-800 hover:bg-slate-900 shadow-slate-700/20' :
                                                    'bg-purple-600 hover:bg-purple-700 shadow-purple-500/20'
                                                }`}>
                                                {presetModal.type === 'LIGHTNING' && <Icons.Lightning size={16} />}
                                                {presetModal.type === 'REMEDIATION' && <Icons.FirstAid size={16} />}
                                                {presetModal.type === 'MAINTENANCE' && <Icons.Wrench size={16} />}
                                                {presetModal.type === 'CARNIVAL' && <Icons.Swimmer size={16} />}
                                                <span>Activate Directive Now ({presetModal.durationMinutes}m)</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {/* Custom Directive Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl max-w-lg w-full p-6 border border-slate-200 shadow-2xl modal-enter space-y-4">
                                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                                    <h3 className="text-lg font-black text-slate-900 flex items-center gap-2">
                                        <Icons.Plus size={20} className="text-blue-600" />
                                        <span>Create Operational Directive</span>
                                    </h3>
                                    <button
                                        onClick={() => setIsModalOpen(false)}
                                        className="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                                        ✕
                                    </button>
                                </div>

                                <form onSubmit={handleSaveCustomDirective} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-extrabold text-slate-700 uppercase mb-1">Directive Title</label>
                                        <input
                                            type="text"
                                            value={formTitle}
                                            onChange={e => setFormTitle(e.target.value)}
                                            placeholder="e.g. Unscheduled Pool Cleaning"
                                            required
                                            className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-blue-500 outline-none"
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
