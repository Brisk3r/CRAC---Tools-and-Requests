<body class="p-2 sm:p-4 md:p-6">

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // Primary & Secondary Firebase Configurations for Live Dual-Database Sync
        const firebaseConfig = {
            apiKey: "AIzaSyBxkpSPfF9znD4T_tH-juzO5hkf44hWUb4",
            authDomain: "synaipse-f45a9.firebaseapp.com",
            projectId: "synaipse-f45a9",
            storageBucket: "synaipse-f45a9.firebasestorage.app",
            messagingSenderId: "1054773853865",
            appId: "1:1054773853865:web:df03635cf472020e1cb3b8"
        };

        const prodFirebaseConfig = {
            apiKey: "AIzaSyAF44-oMKqTKPcMgOuKfJJqUTJz9JYTHAg",
            authDomain: "osf---availability-roster.firebaseapp.com",
            projectId: "osf---availability-roster",
            storageBucket: "osf---availability-roster.firebasestorage.app",
            messagingSenderId: "1069751236100",

        };

        let fbApp = null;
        let db = null;
        let auth = null;

        try {
            if (!firebase.apps.length) {
                fbApp = firebase.initializeApp(firebaseConfig);
            } else {

        try {
            const existingProd = firebase.apps.find(a => a.name === 'prodRoster');
            prodApp = existingProd || firebase.initializeApp(prodFirebaseConfig, 'prodRoster');
            prodDb = prodApp.firestore();
            prodAuth = prodApp.auth();
        } catch (err) {
            console.warn("Secondary Firebase initialisation notice:", err.message);
        }

        const Icons = {
            Waves: ({ size = 20, className = "" }) => <i className={`ph-bold ph-waves ${className}`} style={{ fontSize: size }}></i>,
            Swimmer: ({ size = 20, className = "" }) => <i className={`ph-bold ph-person-simple-swim ${className}`} style={{ fontSize: size }}></i>,
            Clock: ({ size = 20, className = "" }) => <i className={`ph-bold ph-clock ${className}`} style={{ fontSize: size }}></i>,
            Warning: ({ size = 20, className = "" }) => <i className={`ph-fill ph-warning ${className}`} style={{ fontSize: size }}></i>,
            CheckCircle: ({ size = 20, className = "" }) => <i className={`ph-fill ph-check-circle ${className}`} style={{ fontSize: size }}></i>,
            ChevronLeft: ({ size = 20, className = "" }) => <i className={`ph-bold ph-caret-left ${className}`} style={{ fontSize: size }}></i>,
            ChevronRight: ({ size = 20, className = "" }) => <i className={`ph-bold ph-caret-right ${className}`} style={{ fontSize: size }}></i>,
            MapPin: ({ size = 20, className = "" }) => <i className={`ph-fill ph-map-pin ${className}`} style={{ fontSize: size }}></i>,
            X: ({ size = 20, className = "" }) => <i className={`ph-bold ph-x ${className}`} style={{ fontSize: size }}></i>,
            Info: ({ size = 20, className = "" }) => <i className={`ph-fill ph-info ${className}`} style={{ fontSize: size }}></i>,
            Snowflake: ({ size = 20, className = "" }) => <i className={`ph-bold ph-snowflake ${className}`} style={{ fontSize: size }}></i>,
            ArrowClockwise: ({ size = 20, className = "" }) => <i className={`ph-bold ph-arrow-clockwise ${className}`} style={{ fontSize: size }}></i>,
            Lightning: ({ size = 20, className = "" }) => <i className={`ph-fill ph-lightning ${className}`} style={{ fontSize: size }}></i>
        };

        // Initialise sync engine strictly for CRAC
        const syncEngine = ZoneSyncAPI.createSyncEngine({
            storageKey: 'crac_manual_closures_v1',
            venue: 'CRAC'
        });

        const CRAC_FACILITY = ZoneSyncAPI.FACILITY_SPECIFICATIONS.CRAC;
        const CRAC_POOLS = CRAC_FACILITY.pools; // 50m Pool, 25m Pool, Program Pool

        const CATEGORY_STYLES = {
            'Learn to Swim': { bg: 'bg-blue-50/95', hoverBg: 'hover:bg-blue-100', text: 'text-blue-950', subText: 'text-blue-700', border: 'border-blue-200', accentBar: 'bg-blue-600', dot: 'bg-blue-600', badge: 'bg-blue-100 text-blue-800 border-blue-200' },
            'Squads': { bg: 'bg-indigo-50/95', hoverBg: 'hover:bg-indigo-100', text: 'text-indigo-950', subText: 'text-indigo-700', border: 'border-indigo-200', accentBar: 'bg-indigo-600', dot: 'bg-indigo-600', badge: 'bg-indigo-100 text-indigo-800 border-indigo-200' },
            'Aqua Fitness': { bg: 'bg-teal-50/95', hoverBg: 'hover:bg-teal-100', text: 'text-teal-950', subText: 'text-teal-700', border: 'border-teal-200', accentBar: 'bg-teal-600', dot: 'bg-teal-600', badge: 'bg-teal-100 text-teal-800 border-teal-200' },
            'Bookings': { bg: 'bg-purple-50/95', hoverBg: 'hover:bg-purple-100', text: 'text-purple-950', subText: 'text-purple-700', border: 'border-purple-200', accentBar: 'bg-purple-600', dot: 'bg-purple-600', badge: 'bg-purple-100 text-purple-800 border-purple-200' },
            'School Carnival': { bg: 'bg-amber-50/95', hoverBg: 'hover:bg-amber-100', text: 'text-amber-950', subText: 'text-amber-700', border: 'border-amber-200', accentBar: 'bg-amber-600', dot: 'bg-amber-600', badge: 'bg-amber-100 text-amber-800 border-amber-200' },
            'Public Lap Swim': { bg: 'bg-emerald-50/80', hoverBg: 'hover:bg-emerald-100/80', text: 'text-emerald-950', subText: 'text-emerald-700', border: 'border-emerald-200/80', accentBar: 'bg-emerald-500', dot: 'bg-emerald-500', badge: 'bg-emerald-100 text-emerald-800 border-emerald-200' },
            'Public Warm Water': { bg: 'bg-cyan-50/80', hoverBg: 'hover:bg-cyan-100/80', text: 'text-cyan-950', subText: 'text-cyan-700', border: 'border-cyan-200/80', accentBar: 'bg-cyan-500', dot: 'bg-cyan-500', badge: 'bg-cyan-100 text-cyan-800 border-cyan-200' },
            'Maintenance Closure': { bg: 'bg-rose-50/95', hoverBg: 'hover:bg-rose-100', text: 'text-rose-950', subText: 'text-rose-700', border: 'border-rose-300', accentBar: 'bg-rose-600', dot: 'bg-rose-600', badge: 'bg-rose-100 text-rose-800 border-rose-300' },
            'Default': { bg: 'bg-slate-50', hoverBg: 'hover:bg-slate-100', text: 'text-slate-900', subText: 'text-slate-600', border: 'border-slate-200', accentBar: 'bg-slate-500', dot: 'bg-slate-500', badge: 'bg-slate-100 text-slate-800 border-slate-200' }
        };

        const localDateKey = (value) => {
            const d = new Date(value);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        const formatOperatingTime = (decimalHour) => {
            if (typeof decimalHour !== 'number' || isNaN(decimalHour)) return '';
            const h = Math.floor(decimalHour);
            const m = Math.round((decimalHour - h) * 60);
            const period = h >= 12 ? 'pm' : 'am';
            const displayH = h > 12 ? h - 12 : (h === 0 ? 12 : h);
            const displayM = m > 0 ? `:${m.toString().padStart(2, '0')}` : ':00';
            return `${displayH}${displayM} ${period}`;
        };

        const parseTimeToDecimal = (timeStr, fallbackDate) => {
            if (typeof timeStr === 'string' && timeStr.includes(':')) {
                const parts = timeStr.trim().split(':');
                const h = parseInt(parts[0], 10);
                const m = parseInt(parts[1], 10);
                if (!isNaN(h) && !isNaN(m)) return h + m / 60;
            }
            if (fallbackDate) {
                const d = new Date(fallbackDate);
                return d.getHours() + d.getMinutes() / 60;
            }
            return 0;
        };

        const getLaneSubtitle = (poolId, lane) => {
            if (poolId === '50m Pool') {
                if (lane === 'Lane 1' || lane === 'Lane 8') return '50m Olympic • Ramp / Edge';
                return '50m Olympic • Lap Swim';
            }
            if (poolId === '25m Pool') {
                if (lane === 'Lane 1' || lane === 'Lane 8') return '25m Indoor • Heated 28°C';
                return '25m Indoor • Lap Swim';
            }
            if (poolId === 'Program Pool') {
                if (lane === 'Zone 1') return 'Warm Water 34°C • Ramp Entry';
                if (lane === 'Zone 2') return 'Warm Water 34°C • Centre';
                return 'Warm Water 34°C • Deep Section';
            }
            return 'Heated Pool';
        };

        const normaliseCracPoolId = (rawPool, rawZone) => {
            const p = String(rawPool || rawZone || '');
            if (/all\s*pools/i.test(p)) return 'All Pools';
            if (/program|warm|hydro|therapy|zone/i.test(p)) return 'Program Pool';
            if (/25m|indoor/i.test(p)) return '25m Pool';
            if (/50m|olympic/i.test(p)) return '50m Pool';
            return '50m Pool';
        };

        const normaliseShortZone = (z) => {
            const str = String(z || '').trim();
            if (!str) return 'All Lanes';
            const stripped = str.replace(/^(50m\s*Pool|25m\s*Pool|Program\s*Pool)\s*-\s*/i, '').trim();
            if (/entire|all\s*lanes|all\s*zones|whole/i.test(stripped)) return 'All Lanes';
            return stripped;
        };

        const normaliseFirestoreDoc = (doc) => {
            const d = doc.data();
            let sDate = d.startDateTime;
            if (sDate && sDate.toDate) sDate = sDate.toDate();
            else if (sDate) sDate = new Date(sDate);
            else if (d.date && d.startTime) sDate = new Date(`${d.date}T${d.startTime}:00`);
            else sDate = new Date();

            let eDate = d.endDateTime;
            if (eDate && eDate.toDate) eDate = eDate.toDate();
            else if (eDate) eDate = new Date(eDate);
            else if (d.date && d.endTime) eDate = new Date(`${d.date}T${d.endTime}:00`);
            else eDate = new Date(sDate.getTime() + 60 * 60 * 1000);

            const poolId = normaliseCracPoolId(d.pool, d.zone || d.lane);
            const rawZones = Array.isArray(d.zones) && d.zones.length > 0
                ? d.zones
                : (d.lane ? [d.lane] : (d.zone ? [d.zone] : ['All Lanes']));
            const cleanZones = rawZones.map(normaliseShortZone);
            const laneVal = cleanZones[0] || 'All Lanes';
            const isAll = Boolean(
                d.isEntirePool ||
                laneVal === 'All Lanes' ||
                cleanZones.includes('All Lanes') ||
                cleanZones.includes('Entire Zone')
            );

            const isManual = Boolean(
                d.isManualOverride ||
                d.isDirective ||
                d.type === 'CLOSURE' ||
                d.category === 'Maintenance Closure'
            );

            return {
                id: doc.id,
                ...d,
                startDateTime: sDate,
                endDateTime: eDate,
                pool: poolId,
                lane: laneVal,
                zone: d.zone || laneVal,
                zones: cleanZones,
                isEntirePool: isAll,
                isManualOverride: isManual,
                isDirective: isManual
            };
        };

        // Clean interval slicer so manual directives override underlying bookings without overlapping bars
        const buildCleanLaneSegments = (laneEvents, openHour, closeHour, lane, poolId) => {
            const points = new Set([openHour, closeHour]);
            const parsed = laneEvents.map(evt => {
                const s = Math.max(openHour, Math.min(closeHour, parseTimeToDecimal(evt.startTime, evt.startDateTime)));
                const e = Math.max(openHour, Math.min(closeHour, parseTimeToDecimal(evt.endTime, evt.endDateTime)));
                if (e > s + 0.01) {
                    points.add(Number(s.toFixed(4)));
                    points.add(Number(e.toFixed(4)));
                }
                return { evt, s, e, isManual: Boolean(evt.isManualOverride || evt.isDirective) };
            }).filter(x => x.e > x.s + 0.01);

            const sortedPts = Array.from(points).sort((a, b) => a - b);
            const rawSlices = [];
            const defaultCat = poolId === 'Program Pool' ? 'Public Warm Water' : 'Public Lap Swim';

            for (let i = 0; i < sortedPts.length - 1; i++) {
                const sliceStart = sortedPts[i];
                const sliceEnd = sortedPts[i + 1];
                if (sliceEnd - sliceStart < 0.01) continue;
                const mid = (sliceStart + sliceEnd) / 2;

                const covering = parsed.filter(item => item.s <= mid && item.e >= mid);
                if (covering.length === 0) {
                    rawSlices.push({
                        type: 'open',
                        start: sliceStart,
                        end: sliceEnd,
                        category: defaultCat,
                        title: defaultCat,
                        lane
                    });
                } else {
                    covering.sort((a, b) => {
                        if (a.isManual !== b.isManual) return a.isManual ? -1 : 1;
                        return b.s - a.s;
                    });
                    const winner = covering[0].evt;
                    rawSlices.push({
                        type: 'event',
                        start: sliceStart,
                        end: sliceEnd,
                        event: winner,
                        lane
                    });
                }
            }

            const merged = [];
            rawSlices.forEach(slice => {
                const prev = merged[merged.length - 1];
                if (
                    prev &&
                    prev.type === slice.type &&
                    Math.abs(prev.end - slice.start) < 0.01 &&
                    ((slice.type === 'open') || (slice.type === 'event' && prev.event && slice.event && prev.event.id === slice.event.id))
                ) {
                    prev.end = slice.end;
                } else {
                    merged.push({ ...slice });
                }
            });

            return merged;
        };

        // --- PUBLIC EMBED COMPONENT ---
        const CRACEmbedApp = () => {
            const urlParams = useMemo(() => new URLSearchParams(window.location.search), []);
            const hideHeader = urlParams.get('hideHeader') === 'true';

            // Optional pool preset via URL (?pool=50m or ?pool=25m or ?pool=program)
            const initPoolId = useMemo(() => {
                const p = (urlParams.get('pool') || '').toLowerCase();
                if (p.includes('50')) return CRAC_POOLS.find(pl => pl.id.includes('50'))?.id || CRAC_POOLS[0].id;
                if (p.includes('25')) return CRAC_POOLS.find(pl => pl.id.includes('25'))?.id || CRAC_POOLS[0].id;
                if (p.includes('program') || p.includes('prg') || p.includes('warm')) return CRAC_POOLS.find(pl => pl.id.includes('Program'))?.id || CRAC_POOLS[0].id;
                return CRAC_POOLS[0].id;
            }, [urlParams]);

            const [selectedPoolId, setSelectedPoolId] = useState(initPoolId);
            const [selectedDate, setSelectedDate] = useState(new Date());
            const [selectedEventModal, setSelectedEventModal] = useState(null);

            const activePool = CRAC_POOLS.find(p => p.id === selectedPoolId) || CRAC_POOLS[0];

            // Synchronisation & Dual Firestore State
            const [syncData, setSyncData] = useState(() => syncEngine.getConsolidatedSchedule('CRAC'));
            const [primaryUser, setPrimaryUser] = useState(null);
            const [prodUser, setProdUser] = useState(null);
            const [primaryEvents, setPrimaryEvents] = useState([]);
            const [secondaryEvents, setSecondaryEvents] = useState([]);
            const [isSyncing, setIsSyncing] = useState(false);
            const [lastUpdatedTime, setLastUpdatedTime] = useState(() => new Date().toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' }));

            // 1. Firebase Anonymous Auth on both projects (wait for onAuthStateChanged before attaching Firestore listeners)
            useEffect(() => {
                const unsubs = [];
                if (auth) {
                    unsubs.push(auth.onAuthStateChanged(u => {
                        if (u) setPrimaryUser(u);
                    }));
                    auth.signInAnonymously().catch(e => console.warn("Primary auth notice:", e));
                }
                if (prodAuth) {
                    unsubs.push(prodAuth.onAuthStateChanged(u => {
                        if (u) setProdUser(u);
                    }));
                    prodAuth.signInAnonymously().catch(() => {
                        prodAuth.signInWithEmailAndPassword('yambapool@clarence.nsw.gov.au', 'YCP*26*').catch(() => {});
                    });
                }
                return () => unsubs.forEach(u => u && u());
            }, []);

            // 2a. Real-Time Firestore Listener on synaipse-f45a9 (attaches strictly after primaryUser is authenticated)
            useEffect(() => {
                if (!db || !primaryUser) return;
                const colName = new URLSearchParams(window.location.search).get('v') === '1' ? 'calendar_events' : 'crac_calendar_events_v2';
                const unsub = db.collection(colName).onSnapshot(snapshot => {
                    setPrimaryEvents(snapshot.docs.map(normaliseFirestoreDoc));
                    setLastUpdatedTime(new Date().toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' }));
                }, err => console.warn("Primary Firestore notice:", err));
                return () => unsub();
            }, [primaryUser]);

            // 2b. Real-Time Firestore Listener on osf---availability-roster (attaches strictly after prodUser is authenticated)
            useEffect(() => {
                if (!prodDb || !prodUser) return;
                const colName = new URLSearchParams(window.location.search).get('v') === '1' ? 'calendar_events' : 'crac_calendar_events_v2';
                const unsub = prodDb.collection(colName).onSnapshot(snapshot => {
                    setSecondaryEvents(snapshot.docs.map(normaliseFirestoreDoc));
                    setLastUpdatedTime(new Date().toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' }));
                }, err => console.warn("Secondary Firestore notice:", err));
                return () => unsub();
            }, [prodUser]);

            const firestoreEvents = useMemo(() => {
                const map = new Map();
                secondaryEvents.forEach(ev => map.set(ev.id, ev));
                primaryEvents.forEach(ev => map.set(ev.id, ev));
                return Array.from(map.values());
            }, [primaryEvents, secondaryEvents]);

            // 3. Refresh local overrides & cloud fetch
            const refreshFeed = useCallback(async () => {
                setIsSyncing(true);
                syncEngine.loadLocalOverrides();
                setSyncData(syncEngine.getConsolidatedSchedule('CRAC'));
                const colName = new URLSearchParams(window.location.search).get('v') === '1' ? 'calendar_events' : 'crac_calendar_events_v2';
                try {
                    if (db && auth && auth.currentUser) {
                        const snap = await db.collection(colName).get();
                        setPrimaryEvents(snap.docs.map(normaliseFirestoreDoc));
                    }
                    if (prodDb && prodAuth && prodAuth.currentUser) {
                        const snap2 = await prodDb.collection(colName).get();
                        setSecondaryEvents(snap2.docs.map(normaliseFirestoreDoc));
                    }
                } catch (e) {}
                setLastUpdatedTime(new Date().toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' }));
                setTimeout(() => setIsSyncing(false), 250);
            }, []);

            useEffect(() => {
                refreshFeed();
            }, [refreshFeed]);

            // 4. Real-Time Cross-Tab Listener for CRAC
            useEffect(() => {
                let channel;
                try {
                    channel = new BroadcastChannel('crac_zone_sync_channel');
                    channel.onmessage = () => {
                        syncEngine.loadLocalOverrides();
                        setSyncData(syncEngine.getConsolidatedSchedule('CRAC'));
                        refreshFeed();
                    };
                } catch (e) {
                    // Fallback
                }

                const handleStorage = (e) => {
                    if (e.key === 'crac_manual_closures_v1') {
                        syncEngine.loadLocalOverrides();
                        setSyncData(syncEngine.getConsolidatedSchedule('CRAC'));
                        refreshFeed();
                    }
                };
                window.addEventListener('storage', handleStorage);
                const interval = setInterval(refreshFeed, 60000);

                return () => {
                    if (channel) channel.close();
                    window.removeEventListener('storage', handleStorage);
                    clearInterval(interval);
                };
            }, [refreshFeed]);

            const targetDateStr = localDateKey(selectedDate);

            // Filter and combine real PGM Firestore events with live directives (no fake seed data)
            const daysEvents = useMemo(() => {
                const liveEvents = firestoreEvents.filter(e => {
                    if (!e || !e.startDateTime) return false;
                    const eDate = e.date || localDateKey(e.startDateTime);
                    const matchDate = eDate === targetDateStr;
                    const matchPool = !e.pool || e.pool === selectedPoolId || e.pool === 'All Pools';
                    const matchVenue = !e.venue || e.venue === 'CRAC';
                    return matchDate && matchPool && matchVenue;
                });

                const localDirectives = (syncData.events || []).filter(e => {
                    if (!e || (!e.isManualOverride && !e.isDirective)) return false;
                    const eDate = e.date || localDateKey(e.startDateTime);
                    const matchPool = !e.pool || e.pool === selectedPoolId || e.pool === 'All Pools';
                    return eDate === targetDateStr && matchPool;
                });

                const combined = [...liveEvents];
                const seenIds = new Set(liveEvents.map(e => e.id));
                localDirectives.forEach(ld => {
                    if (!seenIds.has(ld.id)) {
                        combined.push(ld);
                        seenIds.add(ld.id);
                    }
                });

                return combined;
            }, [syncData, firestoreEvents, targetDateStr, selectedPoolId]);

            const activeClosures = useMemo(() => {
                return daysEvents.filter(e => e.isManualOverride || e.isDirective);
            }, [daysEvents]);

            const fullDayPoolClosure = useMemo(() => {
                return daysEvents.find(e => {
                    if (!e.isManualOverride && !e.isDirective) return false;
                    if (!e.isEntirePool) return false;
                    const s = parseTimeToDecimal(e.startTime, e.startDateTime);
                    const en = parseTimeToDecimal(e.endTime, e.endDateTime);
                    return (en - s) >= 6;
                });
            }, [daysEvents]);

            // Operating Hours & Season Logic
            const seasonRules = window.CRAC_SEASON_LOGIC || (window.getSeasonLogic && window.getSeasonLogic('CRAC'));
            const isSeasonalShutdown = useMemo(() => {
                return activePool.id === '50m Pool' && seasonRules &&
                    !seasonRules.getOperatingStatus(selectedDate, '50m pool').open;
            }, [activePool, selectedDate, seasonRules]);

            const operatingStatus = useMemo(() => {
                if (seasonRules) {
                    return seasonRules.getOperatingStatus(selectedDate, selectedPoolId);
                }
                return { open: true, openHour: 5.5, closeHour: 19 };
            }, [seasonRules, selectedDate, selectedPoolId]);

            const formattedHoursString = useMemo(() => {
                if (!operatingStatus.open) return operatingStatus.reason || 'Closed';
                const openStr = formatOperatingTime(operatingStatus.openHour);
                const closeStr = formatOperatingTime(operatingStatus.closeHour);
                return `${openStr} to ${closeStr}`;
            }, [operatingStatus]);

            const openHour = operatingStatus.openHour || 5.5;
            const closeHour = operatingStatus.closeHour || 19;
            const totalDayHours = Math.max(1, closeHour - openHour);

            const timeTicks = useMemo(() => {
                const ticks = [];
                ticks.push({ hour: openHour, label: formatOperatingTime(openHour), isMajor: true });

                const firstInt = Math.ceil(openHour);
                for (let h = firstInt; h < closeHour; h++) {
                    if (h - openHour >= 0.4) {
                        ticks.push({ hour: h, label: formatOperatingTime(h), isMajor: true });
                    }
                }
                ticks.push({ hour: closeHour, label: formatOperatingTime(closeHour), isMajor: true });
                return ticks;
            }, [openHour, closeHour]);

            const getEventsForLane = useCallback((lane) => {
                return daysEvents.filter(e => {
                    if (!e) return false;
                    if (e.pool && e.pool !== activePool.id && e.pool !== 'All Pools') return false;
                    if (e.isEntirePool || e.lane === 'All Lanes' || e.zone === 'All Lanes') return true;
                    if (e.lane === lane || e.zone === lane) return true;
                    if (Array.isArray(e.zones) && (e.zones.includes('Entire Zone') || e.zones.includes('All Lanes') || e.zones.includes(lane))) return true;
                    return false;
                });
            }, [daysEvents, activePool]);

            const kpiMetrics = useMemo(() => {
                if (isSeasonalShutdown || fullDayPoolClosure || !operatingStatus.open) {
                    return {
                        totalCapacity: activePool.lanes.length * totalDayHours,
                        bookedHours: activePool.lanes.length * totalDayHours,
                        openHours: 0,
                        percentOpen: 0
                    };
                }

                let totalOpenLaneHours = 0;
                activePool.lanes.forEach(lane => {
                    const segs = buildCleanLaneSegments(getEventsForLane(lane), openHour, closeHour, lane, activePool.id);
                    segs.forEach(seg => {
                        if (seg.type === 'open') {
                            totalOpenLaneHours += Math.max(0, seg.end - seg.start);
                        }
                    });
                });

                const totalCapacity = activePool.lanes.length * totalDayHours;
                const openHours = Math.min(totalCapacity, Math.max(0, totalOpenLaneHours));
                const bookedHours = Math.max(0, totalCapacity - openHours);
                const percentOpen = totalCapacity > 0 ? Math.round((openHours / totalCapacity) * 100) : 0;

                return { totalCapacity, bookedHours, openHours, percentOpen };
            }, [activePool, getEventsForLane, isSeasonalShutdown, fullDayPoolClosure, operatingStatus, openHour, closeHour, totalDayHours]);

            const getLaneSegments = (lane) => {
                return buildCleanLaneSegments(getEventsForLane(lane), openHour, closeHour, lane, activePool.id);
            };

            return (
                <div className="max-w-[1500px] w-full mx-auto space-y-4">
                    {!hideHeader && (
                        <header className="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200/90 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className="w-12 h-12 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-md shadow-blue-500/20">
                                    <Icons.Waves size={26} />
                                </div>
                                <div>
                                    <div className="flex items-center gap-2">
                                        <h1 className="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">
                                            Clarence Regional Aquatic Centre
                                        </h1>
                                        <span className="px-2.5 py-0.5 rounded-full text-[11px] font-extrabold uppercase tracking-wide bg-blue-50 text-blue-700 border border-blue-200">
                                            Live Availability
                                        </span>
                                    </div>
                                    <p className="text-xs font-semibold text-slate-500 mt-0.5 flex items-center gap-1.5">
                                        <Icons.MapPin size={13} className="text-blue-600" />
                                        <span>Grafton, NSW</span>
                                        <span>•</span>
                                        <span>Olympic, Heated &amp; Warm Water Pools</span>
                                    </p>
                                </div>
                            </div>
                        </header>
                    )}

                    {/* Safety Alert Banner */}
                    {activeClosures.length > 0 && (
                        <div className="bg-rose-50 border border-rose-200 rounded-2xl p-4 flex items-start gap-3.5 shadow-sm">
                            <div className="p-2 bg-rose-600 text-white rounded-xl shadow-xs mt-0.5">
                                <Icons.Warning size={20} />
                            </div>
                            <div className="flex-1">
                                <div className="flex items-center gap-2">
                                    <h3 className="text-sm font-black text-rose-950 uppercase tracking-wide">
                                        CRAC Safety &amp; Operational Notice
                                    </h3>
                                    <span className="text-[10px] font-black bg-rose-200 text-rose-900 px-2 py-0.5 rounded-full">
                                        {activeClosures.length} Active Directive{activeClosures.length > 1 ? 's' : ''}
                                    </span>
                                </div>
                                <div className="mt-1 space-y-1">
                                    {activeClosures.map(c => (
                                        <p key={c.id} className="text-xs font-semibold text-rose-800">
                                            <strong>{c.title}</strong>: {c.reason || c.publicNote || 'Safety directive active'} (Target: {c.pool} • {c.zones?.join(', ') || 'All'})
                                        </p>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Main Timeline Card */}
                    <main className="bg-white rounded-2xl border border-slate-200/90 shadow-sm overflow-hidden">
                        {/* Pool Selector & Date Navigation */}
                        <div className="p-4 sm:p-5 border-b border-slate-100 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                            <div className="flex flex-wrap gap-2">
                                {CRAC_POOLS.map(pool => {
                                    const isSelected = selectedPoolId === pool.id;
                                    return (
                                        <button
                                            key={pool.id}
                                            onClick={() => setSelectedPoolId(pool.id)}
                                            className={`px-4 py-2.5 rounded-xl font-extrabold text-xs transition flex items-center gap-2 ${
                                                isSelected
                                                    ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20'
                                                    : 'bg-slate-100 hover:bg-slate-200 text-slate-700'
                                            }`}>
                                            <Icons.Waves size={16} />
                                            <span>{pool.name}</span>
                                            <span className={`text-[10px] font-black px-1.5 py-0.5 rounded-md ${
                                                isSelected ? 'bg-blue-700 text-white' : 'bg-slate-200 text-slate-700'
                                            }`}>
                                                {pool.capacity} {pool.unit}
                                            </span>
                                        </button>
                                    );
                                })}
                            </div>

                            <div className="flex items-center gap-1.5 bg-slate-100 p-1 rounded-xl self-start lg:self-auto border border-slate-200">
                                <button
                                    onClick={() => {
                                        const prev = new Date(selectedDate);
                                        prev.setDate(prev.getDate() - 1);
                                        setSelectedDate(prev);
                                    }}
                                    className="p-2 hover:bg-white text-slate-600 rounded-lg transition"
                                    title="Previous Day">
                                    <Icons.ChevronLeft size={16} />
                                </button>
                                <button
                                    onClick={() => setSelectedDate(new Date())}
                                    className="px-3 py-1.5 text-xs font-black hover:bg-white text-slate-800 rounded-lg transition">
                                    Today
                                </button>
                                <button
                                    onClick={() => {
                                        const next = new Date(selectedDate);
                                        next.setDate(next.getDate() + 1);
                                        setSelectedDate(next);
                                    }}
                                    className="p-2 hover:bg-white text-slate-600 rounded-lg transition"
                                    title="Next Day">
                                    <Icons.ChevronRight size={16} />
                                </button>
                                <span className="text-xs font-black text-slate-800 px-3">
                                    {selectedDate.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' })}
                                </span>
                            </div>
                        </div>

                        {/* KPI Ribbon */}
                        <div className="px-4 sm:px-5 py-3 bg-slate-50/70 border-b border-slate-100 grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
                            <div className="bg-white p-3 rounded-xl border border-slate-200/80 shadow-xs">
                                <span className="text-[10px] font-black text-slate-400 uppercase tracking-wider block">Operating Hours</span>
                                <div className="font-extrabold text-slate-900 mt-0.5 flex items-center gap-1.5">
                                    <Icons.Clock size={15} className="text-blue-600 shrink-0" />
                                    <span>{formattedHoursString}</span>
                                </div>
                            </div>

                            <div className="bg-white p-3 rounded-xl border border-slate-200/80 shadow-xs">
                                <span className="text-[10px] font-black text-slate-400 uppercase tracking-wider block">Pool Capacity</span>
                                <div className="font-extrabold text-slate-900 mt-0.5 flex items-center gap-1.5">
                                    <Icons.Waves size={15} className="text-blue-600 shrink-0" />
                                    <span>{activePool.capacity} {activePool.unit}</span>
                                </div>
                            </div>

                            <div className="bg-white p-3 rounded-xl border border-slate-200/80 shadow-xs">
                                <span className="text-[10px] font-black text-slate-400 uppercase tracking-wider block">Public Lane Availability</span>
                                <div className="font-extrabold text-emerald-700 mt-0.5 flex items-center gap-1.5">
                                    <Icons.CheckCircle size={15} className="text-emerald-600 shrink-0" />
                                    <span>{kpiMetrics.openHours.toFixed(1)} hrs ({kpiMetrics.percentOpen}% Public)</span>
                                </div>
                            </div>

                            <div className="bg-white p-3 rounded-xl border border-slate-200/80 shadow-xs">
                                <span className="text-[10px] font-black text-slate-400 uppercase tracking-wider block">Lap Swimming</span>
                                <div className="font-extrabold text-blue-900 mt-0.5 flex items-center gap-1.5">
                                    <Icons.Swimmer size={15} className="text-blue-600 shrink-0" />
                                    <span>Public Access Open</span>
                                </div>
                            </div>
                        </div>

                        {/* Horizontal Timeline */}
                        <div className="p-4 sm:p-5">
                            {isSeasonalShutdown ? (
                                <div className="py-16 text-center bg-slate-50 border border-dashed border-slate-200 rounded-2xl">
                                    <Icons.Snowflake size={40} className="mx-auto text-blue-400 mb-2" />
                                    <h3 className="font-black text-slate-800 text-base">Winter Season Closure</h3>
                                    <p className="text-xs text-slate-500 max-w-md mx-auto mt-1 font-medium">
                                        The 50m Olympic Pool is currently closed for the winter off-peak season. Please check our year-round 25m heated pool.
                                    </p>
                                </div>
                            ) : fullDayPoolClosure ? (
                                <div className="py-16 text-center bg-rose-50 border border-dashed border-rose-300 rounded-2xl">
                                    <Icons.Warning size={40} className="mx-auto text-rose-500 mb-2" />
                                    <h3 className="font-black text-rose-950 text-base">{fullDayPoolClosure.title}</h3>
                                    <p className="text-xs text-rose-700 max-w-md mx-auto mt-1 font-medium">
                                        {fullDayPoolClosure.reason || fullDayPoolClosure.publicNote}
                                    </p>
                                </div>
                            ) : (
                                <div className="border border-slate-200 rounded-2xl overflow-hidden bg-white shadow-xs">
                                    <div className="overflow-x-auto custom-scrollbar">
                                        <div className="min-w-[840px]">
                                            <div className="flex border-b border-slate-200 bg-slate-50/80">
                                                <div className="w-32 sm:w-40 shrink-0 p-3 text-xs font-black text-slate-500 uppercase tracking-wider border-r border-slate-200 bg-slate-100/60">
                                                    Zone
                                                </div>
                                                <div className="flex-1 flex">
                                                    {timeTicks.map((tick, idx) => (
                                                        <div
                                                            key={idx}
                                                            className="flex-1 text-center py-2.5 text-[11px] font-black text-slate-600 border-r border-slate-200/60 last:border-r-0">
                                                            {tick.label}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            <div className="divide-y divide-slate-100">
                                                {activePool.lanes.map(lane => {
                                                    const segments = getLaneSegments(lane);
                                                    return (
                                                        <div key={lane} className="flex min-h-[58px] relative hover:bg-slate-50/50 transition">
                                                            <div className="w-32 sm:w-40 shrink-0 p-3 border-r border-slate-200 bg-slate-50/30 flex flex-col justify-center">
                                                                <span className="text-xs font-black text-slate-900">{lane}</span>
                                                                <span className="text-[10px] text-slate-400 font-semibold truncate mt-0.5">
                                                                    {getLaneSubtitle(activePool.id, lane)}
                                                                </span>
                                                            </div>

                                                            <div className="flex-1 relative flex">
                                                                {timeTicks.map((t, idx) => (
                                                                    <div key={idx} className="flex-1 border-r border-slate-100 h-full pointer-events-none"></div>
                                                                ))}

                                                                {segments.map((seg, sIdx) => {
                                                                    const clampedStart = Math.max(openHour, Math.min(closeHour, seg.start));
                                                                    const clampedEnd = Math.max(openHour, Math.min(closeHour, seg.end));

                                                                    if (clampedEnd <= clampedStart) return null;

                                                                    const leftPct = ((clampedStart - openHour) / totalDayHours) * 100;
                                                                    const widthPct = Math.max(1.5, ((clampedEnd - clampedStart) / totalDayHours) * 100);

                                                                    const isEvent = seg.type === 'event';
                                                                    const evt = seg.event;
                                                                    const isManual = isEvent && (evt.isManualOverride || evt.isDirective);
                                                                    const category = isManual ? 'Maintenance Closure' : (isEvent ? (evt.category || 'Bookings') : seg.category);
                                                                    const style = CATEGORY_STYLES[category] || CATEGORY_STYLES['Default'];

                                                                    return (
                                                                        <div
                                                                            key={sIdx}
                                                                            onClick={() => {
                                                                                if (isEvent) {
                                                                                    setSelectedEventModal(evt);
                                                                                } else {
                                                                                    setSelectedEventModal({
                                                                                        title: seg.title,
                                                                                        category: seg.category,
                                                                                        pool: activePool.name,
                                                                                        zones: [lane],
                                                                                        startTime: formatOperatingTime(seg.start),
                                                                                        endTime: formatOperatingTime(seg.end),
                                                                                        isOpenSwim: true,
                                                                                        publicNote: 'Open public swimming lane. No booking or reservation required.'
                                                                                    });
                                                                                }
                                                                            }}
                                                                            style={{
                                                                                left: `${leftPct}%`,
                                                                                width: `${widthPct}%`
                                                                            }}
                                                                            className={`absolute top-1.5 bottom-1.5 rounded-xl border flex items-center px-2 sm:px-2.5 transition shadow-xs cursor-pointer overflow-hidden ${
                                                                                isManual
                                                                                    ? 'hazard-stripes-bold border-rose-500 text-rose-950 z-30 shadow-md ring-1 ring-rose-400'
                                                                                    : `${style.bg} ${style.hoverBg} ${style.border} ${style.text} z-10`
                                                                            }`}>
                                                                            <div className={`absolute left-0 top-0 bottom-0 w-1 ${isManual ? 'bg-rose-600' : style.accentBar}`}></div>

                                                                            <div className="truncate pl-1.5 flex flex-col justify-center">
                                                                                <div className="flex items-center gap-1.5">
                                                                                    <span className={`w-1.5 h-1.5 rounded-full shrink-0 ${isManual ? 'bg-rose-600 animate-pulse' : style.dot}`}></span>
                                                                                    <span className="font-black text-xs truncate">
                                                                                        {isEvent ? evt.title : seg.title}
                                                                                    </span>
                                                                                </div>
                                                                                <span className={`text-[10px] font-bold truncate ${isManual ? 'text-rose-700' : style.subText}`}>
                                                                                    {formatOperatingTime(seg.start)} to {formatOperatingTime(seg.end)}
                                                                                </span>
                                                                            </div>
                                                                        </div>
                                                                    );
                                                                })}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* Event Detail Modal */}
                    {selectedEventModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-3xl max-w-md w-full border border-slate-200 shadow-2xl modal-enter overflow-hidden">
                                <div className="p-6 border-b border-slate-100 flex items-start justify-between gap-4">
                                    <div>
                                        <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider border ${
                                            CATEGORY_STYLES[selectedEventModal.category]?.badge || 'bg-slate-100 text-slate-800 border-slate-200'
                                        }`}>
                                            {selectedEventModal.category || 'Schedule Details'}
                                        </span>
                                        <h3 className="text-lg font-black text-slate-900 mt-2">
                                            {selectedEventModal.title}
                                        </h3>
                                    </div>
                                    <button
                                        onClick={() => setSelectedEventModal(null)}
                                        className="p-1.5 rounded-full hover:bg-slate-100 text-slate-400 hover:text-slate-600 transition">
                                        <Icons.X size={18} />
                                    </button>
                                </div>

                                <div className="p-6 space-y-4">
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="bg-slate-50 border border-slate-200/70 rounded-2xl p-3.5">
                                            <span className="text-[10px] font-black uppercase tracking-wider text-slate-400 block">Location</span>
                                            <div className="flex items-center gap-1.5 mt-1">
                                                <Icons.MapPin size={15} className="text-blue-600 shrink-0" />
                                                <span className="text-xs font-black text-slate-900 truncate">
                                                    {selectedEventModal.pool}
                                                </span>
                                            </div>
                                            <span className="text-[11px] text-slate-500 font-bold mt-0.5 block truncate">
                                                {selectedEventModal.zones?.join(', ') || selectedEventModal.zone || 'All Lanes'}
                                            </span>
                                        </div>

                                        <div className="bg-slate-50 border border-slate-200/70 rounded-2xl p-3.5">
                                            <span className="text-[10px] font-black uppercase tracking-wider text-slate-400 block">Time Slot</span>
                                            <div className="flex items-center gap-1.5 mt-1">
                                                <Icons.Clock size={15} className="text-blue-600 shrink-0" />
                                                <span className="text-xs font-black text-slate-900 truncate">
                                                    {selectedEventModal.startTime || (selectedEventModal.startDateTime ? new Date(selectedEventModal.startDateTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '')} to {selectedEventModal.endTime || (selectedEventModal.endDateTime ? new Date(selectedEventModal.endDateTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '')}
                                                </span>
                                            </div>
                                            <span className="text-[11px] text-emerald-600 font-bold mt-0.5 block">
                                                {selectedEventModal.isOpenSwim ? 'No Booking Needed' : 'Allocated'}
                                            </span>
                                        </div>
                                    </div>

                                    <div className="p-4 rounded-2xl border bg-slate-50 border-slate-200 text-slate-800 flex items-start gap-3">
                                        <div className="shrink-0 mt-0.5">
                                            <Icons.Info size={18} className="text-blue-600" />
                                        </div>
                                        <div className="text-xs">
                                            <span className="font-black uppercase tracking-wider text-[10px] block mb-0.5">
                                                Public Schedule Details
                                            </span>
                                            <p className="leading-relaxed font-medium">
                                                {selectedEventModal.publicNote || selectedEventModal.reason || 'General public swimming is available in this zone.'}
                                            </p>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-slate-50/80 px-6 py-3.5 border-t border-slate-100 flex items-center justify-between">
                                    <span className="text-[10px] font-bold text-slate-400">
                                        Clarence Regional Aquatic Centre
                                    </span>
                                    <button
                                        onClick={() => setSelectedEventModal(null)}
                                        className="px-5 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-extrabold shadow-sm transition active:scale-95">
                                        Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CRACEmbedApp />);
    </script>
</body>
</html>
